<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Infinite Stopwatch</title>
<style>
  :root { --bg:#05070d; --fg:#e8f0ff; --accent:#4cc9f0; --dim:#7a8599; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg);
    font-family: "SF Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow-x: hidden; }
  h1 { font-size: clamp(14px, 3vw, 20px); letter-spacing: .3em; color: var(--dim); text-transform: uppercase; margin-bottom: 24px; text-align: center; }
  #clock { display: flex; gap: clamp(8px, 2vw, 28px); width: 100%; max-width: 1100px; justify-content: center; align-items: flex-end; }
  .unit { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .unit.days { flex: 1 1 auto; min-width: 0; }
  .num { font-weight: 700; color: var(--accent); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .label { margin-top: 8px; font-size: 12px; letter-spacing: .25em; color: var(--dim); text-transform: uppercase; }
  #status { margin-top: 28px; font-size: 13px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<h1>Alpha Infinite Stopwatch</h1>
<div id="clock">
  <div class="unit days"><div class="num" id="d">0</div><div class="label">Days</div></div>
  <div class="unit"><div class="num" id="h">00</div><div class="label">Hours</div></div>
  <div class="unit"><div class="num" id="m">00</div><div class="label">Minutes</div></div>
  <div class="unit"><div class="num" id="s">00</div><div class="label">Seconds</div></div>
</div>
<p id="status"></p>

<script>
// Start moment: 28 Oct 2026, 04:00:00 Bangladesh time (UTC+06:00, no daylight saving)
const START_MS = Date.parse("2026-10-28T04:00:00+06:00");

const $ = id => document.getElementById(id);
const el = { d: $("d"), h: $("h"), m: $("m"), s: $("s") };
const pad = n => String(n).padStart(2, "0");

// Days use BigInt so the counter has no upper limit and never loses precision.
function split(elapsedMs) {
  const totalSec = BigInt(Math.floor(elapsedMs / 1000));
  const days = totalSec / 86400n;
  const rem = Number(totalSec % 86400n);          // always 0..86399, safe as a normal Number
  return { days, h: Math.floor(rem / 3600), m: Math.floor((rem % 3600) / 60), s: rem % 60 };
}

// Size the numbers so nothing ever overflows its box, however many digits the day count has.
function fit(daysText) {
  const vw = Math.min(window.innerWidth, 1100);
  const chars = daysText.length + 6;               // days + HH MM SS
  const size = Math.max(14, Math.min(120, (vw * 0.9) / (chars * 0.62 + 3)));
  Object.values(el).forEach(n => (n.style.fontSize = size + "px"));
}

let lastDays = "";
function tick() {
  const now = Date.now();                          // recalculated every tick, so no drift
  const elapsed = Math.max(0, now - START_MS);     // before the start moment, show zeros
  const t = split(elapsed);
  const daysText = t.days.toLocaleString("en-US");
  if (daysText !== lastDays) { el.d.textContent = daysText; fit(daysText); lastDays = daysText; }
  el.h.textContent = pad(t.h);
  el.m.textContent = pad(t.m);
  el.s.textContent = pad(t.s);
  $("status").textContent = now < START_MS
    ? "Waiting for 28 Oct 2026, 04:00 AM (Bangladesh time)"
    : "Running since 28 Oct 2026, 04:00 AM (Bangladesh time)";
  setTimeout(tick, 1000 - (now % 1000) + 5);       // align to the next real second
}
window.addEventListener("resize", () => fit(lastDays));
document.addEventListener("visibilitychange", tick); // refresh instantly when the tab returns
tick();
</script>
</body>
</html>
